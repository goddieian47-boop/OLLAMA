name: Android chatbot

on:
  workflow_dispatch:
  push:
    paths:
      - "android_chatbot/**"
      - ".github/workflows/android-chatbot.yml"
  pull_request:
    paths:
      - "android_chatbot/**"
      - ".github/workflows/android-chatbot.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        shell: bash
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmake;3.31.6" "ndk;27.2.12479018"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        working-directory: android_chatbot
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: android_chatbot
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: local-chat-debug-apk
          path: android_chatbot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
